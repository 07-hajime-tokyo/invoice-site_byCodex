name: Codex apply production changes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Codex patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          matching_path = Path("shared/productMatching.ts")
          text = matching_path.read_text(encoding="utf-8")
          text = text.replace(
              'type ConditionQualifier = "good" | "screen-defect" | "junk";',
              'type ConditionQualifier = "good" | "screen-defect" | "exterior-damage" | "junk";',
              1,
          )
          screen_marker = '''    "screen burn",
            ]],
            ["good", [
          '''
          screen_replacement = '''    "screen burn",
            ]],
            ["exterior-damage", [
              "外装傷あり",
              "外装傷有り",
              "外装傷",
              "外装キズ",
              "外装きず",
              "外観傷あり",
              "外観傷有り",
              "外観傷",
              "筐体傷あり",
              "筐体傷",
              "damage exterior",
              "damaged exterior",
              "exterior damage",
              "exterior damaged",
              "with damage exterior",
              "with exterior damage",
            ]],
            ["good", [
          '''
          if '["exterior-damage"' not in text:
              if screen_marker not in text:
                  raise SystemExit("screen marker not found")
              text = text.replace(screen_marker, screen_replacement, 1)
          matching_path.write_text(text, encoding="utf-8")

          test_path = Path("shared/productMatching.test.ts")
          text = test_path.read_text(encoding="utf-8")
          stock_marker = '  it("現在庫照合でも管理番号の状態表記とインボイス状態行を合わせる", () => {'
          exterior_test = '''  it("管理番号の外装傷ありをdamage exterior行へ分類する", () => {
            const products = [
              { name: "3DS LL Blackbase", qty: 10 },
              { name: "3DS LL Blackbase with damage exterior", qty: 10 },
            ];

            expect(suggestCsvProduct("3DS LL", "427_サミー_外装傷あり_1/10", products)?.name)
              .toBe("3DS LL Blackbase with damage exterior");
          });

          '''
          if "管理番号の外装傷あり" not in text:
              if stock_marker not in text:
                  raise SystemExit("stock marker not found")
              text = text.replace(stock_marker, exterior_test + stock_marker, 1)
          psp_expect = '''    expect(inventoryItemCanMatchCsvProduct(
              "PSP 3000 425_サミー_PSP3000画面不良_1/15",
              "PSP 3000 画面不具合",
            )).toBe(true);'''
          exterior_expect = '''    expect(inventoryItemCanMatchCsvProduct(
              "3DS LL 427_サミー_外装傷あり_1/10",
              "3DS LL Blackbase with damage exterior",
            )).toBe(true);'''
          if "3DS LL 427_サミー_外装傷あり_1/10" not in text:
              if psp_expect not in text:
                  raise SystemExit("psp expect marker not found")
              text = text.replace(psp_expect, psp_expect + "\n" + exterior_expect, 1)
          test_path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/codex-apply-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/productMatching.ts shared/productMatching.test.ts .github/workflows/codex-apply-production.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Match exterior damage invoice rows"
          git push origin HEAD:main
