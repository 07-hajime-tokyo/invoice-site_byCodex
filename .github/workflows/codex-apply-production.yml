name: Codex apply production changes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Codex formatting patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("shared/productMatching.test.ts")
          text = path.read_text(encoding="utf-8")
          bad_block = '''  it("管理番号の外装傷ありをdamage exterior行へ分類する", () => {
            const products = [
              { name: "3DS LL Blackbase", qty: 10 },
              { name: "3DS LL Blackbase with damage exterior", qty: 10 },
            ];

            expect(suggestCsvProduct("3DS LL", "427_サミー_外装傷あり_1/10", products)?.name)
              .toBe("3DS LL Blackbase with damage exterior");
          });
          '''
          # YAML de-indentation left this block with 2 fewer spaces on every line.
          bad_block = bad_block.replace("\n          ", "\n")
          good_block = '''  it("管理番号の外装傷ありをdamage exterior行へ分類する", () => {
            const products = [
              { name: "3DS LL Blackbase", qty: 10 },
              { name: "3DS LL Blackbase with damage exterior", qty: 10 },
            ];

            expect(suggestCsvProduct("3DS LL", "427_サミー_外装傷あり_1/10", products)?.name)
              .toBe("3DS LL Blackbase with damage exterior");
          });
          '''
          if bad_block in text:
              text = text.replace(bad_block, good_block, 1)
          text = text.replace(
              '      "PSP 3000 画面不具合",\n  )).toBe(true);\n  expect(inventoryItemCanMatchCsvProduct(\n    "3DS LL 427_サミー_外装傷あり_1/10",\n    "3DS LL Blackbase with damage exterior",\n  )).toBe(true);',
              '      "PSP 3000 画面不具合",\n    )).toBe(true);\n    expect(inventoryItemCanMatchCsvProduct(\n      "3DS LL 427_サミー_外装傷あり_1/10",\n      "3DS LL Blackbase with damage exterior",\n    )).toBe(true);',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/codex-apply-production.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/productMatching.test.ts .github/workflows/codex-apply-production.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Format exterior damage matching test"
          git push origin HEAD:main
